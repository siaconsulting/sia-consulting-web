# Temporary HTTP-only vhost for ACME webroot validation. Enable only after DNS points
# to this VPS; replace the server_name if the approved canonical host changes.
server {
    listen 80;
    listen [::]:80;
    server_name siaconsulting.fr www.siaconsulting.fr;

    access_log /var/log/nginx/sia-access.log sia_safe;
    error_log /var/log/nginx/sia-error.log warn;
    client_max_body_size 50m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
