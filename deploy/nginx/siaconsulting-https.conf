# Install in /etc/nginx/sites-available and enable after the certificate exists.
# No CSP is imposed here; test a Report-Only policy separately before enforcement.
server {
    listen 80;
    listen [::]:80;
    server_name siaconsulting.fr;
    access_log /var/log/nginx/sia-access.log sia_safe;
    error_log /var/log/nginx/sia-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://siaconsulting.fr$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.siaconsulting.fr;
    access_log /var/log/nginx/sia-access.log sia_safe;
    error_log /var/log/nginx/sia-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://siaconsulting.fr$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siaconsulting.fr;

    ssl_certificate /etc/letsencrypt/live/siaconsulting.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siaconsulting.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SIASSL:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/sia-access.log sia_safe;
    error_log /var/log/nginx/sia-error.log warn;
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.siaconsulting.fr;

    ssl_certificate /etc/letsencrypt/live/siaconsulting.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siaconsulting.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/sia-access.log sia_safe;
    error_log /var/log/nginx/sia-error.log warn;
    return 301 https://siaconsulting.fr$request_uri;
}
