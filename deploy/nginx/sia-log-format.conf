# Install in /etc/nginx/conf.d/ (inside Nginx's http context).
# Deliberately excludes $request, $request_uri, $args, and Referer: Payload preview
# URLs include a query token. Keep Nginx error logs private and short-retained too.
log_format sia_safe '$remote_addr [$time_iso8601] "$uri" $status $body_bytes_sent $request_time';
